name: Collect infrastructure research

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: research-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest discover -s research -p "test_*.py" -v

      - name: Collect public feed entries
        run: python research/collect.py

      - name: Open or update unreviewed research pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/research-queue
          delete-branch: true
          add-paths: research/data/research-queue.json
          commit-message: "Update unreviewed research queue"
          title: "Refresh unreviewed infrastructure research queue"
          body: |
            Automated collection from the curated public feeds in `research/sources.json`.

            Eligible entries are sorted by deterministic relevance score. Excluded entries are retained separately with an exclusion reason. New entries remain `unreviewed` and are not displayed on public-facing pages. Verify each source article, excerpt, category, score reasons, company/ticker metadata, and publication time before updating a finding's `review_status` and merging this pull request.

            Collection is rules-based feed triage only; no LLM analysis, investment recommendation, live financial data, or automatic publication is produced.
          draft: true
